[project]
name = "las-venue-tracker"
version = "0.2.0"
description = "Weekly LLM-driven web-search tracker for workshops/conferences/CFPs relevant to largeagentsystems.org"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
