name: Restyle event descriptions

# Manual only. This rewrites rows that are already published in
# docs/events.json, so it must never fire on a schedule or on a push — it is
# run deliberately, by a person, after reading a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Print every old -> new description in the job summary and write
          nothing. Defaults on: a real run rewrites every row of
          data/discoveries.db, so read a dry run first.
        type: boolean
        default: true
      limit:
        description: "Restyle at most this many rows (blank = all of them)."
        type: string
        default: ""
      batch_size:
        description: "Events per model call (blank = the script's default of 5)."
        type: string
        default: ""

permissions:
  contents: write

# Shared with track.yaml on purpose: the weekly tracker and this job both
# write data/discoveries.db and docs/events.json, and discoveries.db is
# binary, so two concurrent runs cannot be merged afterwards. Queue, don't
# cancel — a cancelled restyle mid-write is worse than a delayed one.
concurrency:
  group: las-venue-tracker
  cancel-in-progress: false

jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit step below rebases onto origin if the
          # remote moved while this job was running, which a depth-1 clone
          # cannot do.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      # Taken BEFORE the restyle step, not after, so the artifact holds the
      # pre-run state even if the run itself corrupts something. The script
      # also takes its own timestamped copy in data/backups/, but that copy
      # lives on the runner and dies with it — this is the one a human can
      # download from the run page.
      - name: Back up the database and feed
        run: |
          mkdir -p backup
          cp data/discoveries.db backup/discoveries.db
          cp docs/events.json backup/events.json

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-restyle-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error

      - name: Restyle descriptions
        env:
          # Secret is named LAS_CONFERENCES_26AUG in this repo's Settings, not
          # OPENROUTER_API_KEY — same mapping as track.yaml. Rename it there
          # and both workflows flip together.
          OPENROUTER_API_KEY: ${{ secrets.LAS_CONFERENCES_26AUG }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          LIMIT: ${{ github.event.inputs.limit }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          python -m tracker.restyle \
            ${LIMIT:+--limit "$LIMIT"} \
            ${BATCH_SIZE:+--batch-size "$BATCH_SIZE"}

      - name: Commit restyled descriptions
        if: github.event.inputs.dry_run != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "las-venue-tracker[bot]"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --cached --quiet -- data docs; then
            echo "no description changes to commit"
            exit 0
          fi
          # [skip ci]: this commit is data, not code — nothing downstream
          # needs to rebuild because of it.
          git commit -m "restyle: rewrite event descriptions to the writing ruleset [skip ci]"

          # track.yaml does a bare `git push` at this point. That is fine for
          # a job that finishes in seconds, but this one makes one model call
          # per batch and can run for minutes, so the remote may well have
          # moved (a weekly track: commit, or a human) before the push — and
          # a bare push would simply fail, throwing away every rewrite the
          # run paid for. Retry, rebasing onto whatever landed.
          #
          # NOTE: track.yaml has the same bare-push weakness and is NOT
          # changed here.
          #
          # data/discoveries.db is binary and docs/events.json is generated,
          # so a genuine conflict cannot be auto-resolved correctly: abort and
          # tell a human, rather than picking a side with -X ours/theirs. The
          # backup artifact above is what makes that recoverable.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — rebasing onto origin/$BRANCH"
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              echo "::error::rebase onto origin/$BRANCH conflicted; the restyle commit was NOT pushed. Download the pre-restyle-backup artifact from this run and reapply by hand."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::push still rejected after 5 attempts; the restyle commit was NOT pushed. The pre-restyle-backup artifact from this run holds the state before the rewrite."
          exit 1
